<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Testseite (2026-11-13): Kann eine Web-App auf iOS 26 bis ganz nach oben
     zeichnen, ohne dass unten die Leiste verschwindet? Die echte App bleibt
     unberührt. Nach dem Test kann dieser Ordner wieder weg. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Randtest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Randtest</title>
<style>
  html, body { margin: 0; height: 100%; }
  /* Trick 1: Färbt iOS den Streifen unten mit der Farbe von <html>? */
  html { background: #2c4a24; }
  /* Trick 2: Kann ein Element über die gemeldete Unterkante hinaus zeichnen? */
  .lila {
    position: fixed; left: 0; width: 50%;
    bottom: calc(-1 * env(safe-area-inset-top)); height: env(safe-area-inset-top);
    background: #c400ff; z-index: 9;
  }
  body {
    background: linear-gradient(180deg, #2f6fb5 0%, #5aa0d8 30%, #7bb661 55%, #2c4a24 100%);
    font: 16px/1.45 -apple-system, system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .rot  { position: fixed; top: 0; left: 0; right: 0; height: 6px; background: #ff2d2d; z-index: 9; }
  .gelb { position: fixed; bottom: 0; left: 0; right: 0; height: 6px; background: #ffd400; z-index: 9; }
  .text {
    position: fixed; left: 20px; right: 20px; top: 38%;
    background: rgba(0,0,0,.55); border-radius: 16px; padding: 14px 16px;
  }
  .text b { display: block; font-size: 18px; margin-bottom: 6px; }
  .werte { font: 12px/1.4 ui-monospace, Menlo, monospace; color: #b9f0a0; margin-top: 8px; }
  .leiste {
    position: fixed; left: 16px; right: 16px;
    bottom: calc(env(safe-area-inset-bottom) + 6px);
    height: 64px; border-radius: 999px;
    background: rgba(20, 26, 20, .8);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    display: grid; place-items: center; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="rot"></div>
  <div class="gelb"></div>
  <div class="lila"></div>
  <div class="text">
    <b>Randtest</b>
    1. Siehst du ganz oben über der Uhrzeit einen <b style="display:inline;font-size:16px;color:#ff6b6b">roten</b> Strich und Blau bis zum Rand?<br>
    2. Siehst du unten die Leiste und darunter einen <b style="display:inline;font-size:16px;color:#ffd400">gelben</b> Strich am Rand?<br>
    3. Test 2: Ist der Streifen unter Gelb jetzt dunkelgrün statt weiß? Ist links darin ein <b style="display:inline;font-size:16px;color:#d966ff">lila</b> Block?
    <div class="werte" id="werte"></div>
  </div>
  <div class="leiste">Leiste unten</div>
<script>
  const s = document.createElement('div');
  s.style.cssText = 'position:fixed;top:0;bottom:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden';
  document.body.appendChild(s);
  const zeigen = () => {
    const cs = getComputedStyle(s);
    document.getElementById('werte').textContent =
      'app ' + (navigator.standalone ? 'ja' : 'nein') + ' · inner ' + innerHeight +
      ' · screen ' + screen.height + ' · fixed ' + Math.round(s.getBoundingClientRect().bottom) +
      ' · oben ' + cs.paddingTop + ' · unten ' + cs.paddingBottom;
  };
  zeigen(); addEventListener('resize', zeigen); setTimeout(zeigen, 500);
</script>
</body>
</html>
