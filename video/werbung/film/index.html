<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #edebe5;
        --ink: #1b1b17;
        --oliv: #4f6814;
        --orange: #ee6b17;
        --font-display: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display);
      }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="abend" data-composition-id="abend" data-composition-src="compositions/abend.html"
        data-start="0" data-duration="6.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="karte" data-composition-id="karte" data-composition-src="compositions/karte.html"
        data-start="6.5" data-duration="7.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="fakten" data-composition-id="fakten" data-composition-src="compositions/fakten.html"
        data-start="14" data-duration="6.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="entdecken" data-composition-id="entdecken" data-composition-src="compositions/entdecken.html"
        data-start="20.5" data-duration="3.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="ende" data-composition-id="ende" data-composition-src="compositions/ende.html"
        data-start="24" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
