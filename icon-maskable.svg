<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dieselbe Zeichnung, aber für Android.
       Android schneidet App-Symbole in eine eigene Form — mal ein Kreis, mal
       ein abgerundetes Quadrat, je nach Handy. Sicher ist nur der innere
       Kreis mit 80% Durchmesser. Deshalb sitzt das Zelt hier kleiner in der
       Mitte: Was außen liegt, kann weggeschnitten werden. -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e2718"/>
      <stop offset="100%" stop-color="#10130d"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#grund)"/>

  <g transform="translate(112,118) scale(12)"
     fill="none" stroke="#7bb661" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 3 20h18L12 3Z"/>
    <path d="M12 3v11"/>
    <path d="m8.4 20 3.6-6 3.6 6"/>
  </g>
</svg>
